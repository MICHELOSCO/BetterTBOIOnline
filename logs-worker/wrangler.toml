name = "bto-logs"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
REPO = "MICHELOSCO/bto-logs"
# GITHUB_TOKEN is a secret: `npx wrangler secret put GITHUB_TOKEN` (never in this file)

# at most 5 logs per minute from one IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
