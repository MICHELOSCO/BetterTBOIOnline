# Each new log from the Worker: rewrite ANALISI.md in every game folder with at least 2 logs.
name: Analisi dei desync
on:
  push:
    paths-ignore: ["**/ANALISI.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analisi
  cancel-in-progress: false
jobs:
  analisi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/analisi.mjs .
      - name: Commit
        run: |
          git add -A -- '*/ANALISI.md'
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "analisi: ANALISI.md aggiornate"
          git pull --rebase && git push
